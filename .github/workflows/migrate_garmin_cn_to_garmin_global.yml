name: Migrate Garmin CN to Garmin Global

on:
  workflow_dispatch:
    inputs:
      migrate_command:
        description: "迁移命令：支持 CN -> Global 或 Global -> CN"
        required: true
        default: "migrate_garmin_cn_to_global"
        type: choice
        options:
          - migrate_garmin_cn_to_global
          - migrate_all_cn_to_global
          - migrate_wellness_cn_to_global
          - migrate_garmin_global_to_cn
          - migrate_all_global_to_cn
          - migrate_wellness_global_to_cn

permissions:
  contents: read

concurrency:
  group: garmin-state
  cancel-in-progress: false

env:
  AESKEY: ${{ secrets.AESKEY }}
  GARMIN_CN_OAUTH1: ${{ secrets.GARMIN_CN_OAUTH1 }}
  GARMIN_CN_OAUTH2: ${{ secrets.GARMIN_CN_OAUTH2 }}
  GARMIN_GLOBAL_OAUTH1: ${{ secrets.GARMIN_GLOBAL_OAUTH1 }}
  GARMIN_GLOBAL_OAUTH2: ${{ secrets.GARMIN_GLOBAL_OAUTH2 }}
  BARK_KEY: ${{ secrets.BARK_KEY }}
  GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
  GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
  GARMIN_GLOBAL_USERNAME: ${{ secrets.GARMIN_GLOBAL_USERNAME }}
  GARMIN_GLOBAL_PASSWORD: ${{ secrets.GARMIN_GLOBAL_PASSWORD }}
  GARMIN_MIGRATE_NUM: ${{ vars.GARMIN_MIGRATE_NUM || secrets.GARMIN_MIGRATE_NUM }}
  GARMIN_MIGRATE_START: ${{ vars.GARMIN_MIGRATE_START || secrets.GARMIN_MIGRATE_START }}
  # Wellness 健康数据默认关闭；需要迁移步数、睡眠、HRV、压力等数据时，在 Variables 中设置 GARMIN_SYNC_WELLNESS=true
  GARMIN_SYNC_WELLNESS: ${{ vars.GARMIN_SYNC_WELLNESS || secrets.GARMIN_SYNC_WELLNESS }}
  # 历史迁移健康数据天数；未配置或 0 表示不迁移历史健康数据
  GARMIN_WELLNESS_MIGRATE_DAYS: ${{ vars.GARMIN_WELLNESS_MIGRATE_DAYS || secrets.GARMIN_WELLNESS_MIGRATE_DAYS }}
  # 历史迁移从今天往前跳过多少天开始；0 表示从今天开始
  GARMIN_WELLNESS_MIGRATE_START_DAYS: ${{ vars.GARMIN_WELLNESS_MIGRATE_START_DAYS || secrets.GARMIN_WELLNESS_MIGRATE_START_DAYS }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Migrate Garmin CN to Garmin Global
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        shell: bash
        run: |
          missing=0
          for name in GARMIN_USERNAME GARMIN_PASSWORD GARMIN_GLOBAL_USERNAME GARMIN_GLOBAL_PASSWORD AESKEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Please add repository secret $name in Settings > Secrets and variables > Actions"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
      - run: yarn --frozen-lockfile
      - uses: ./.github/actions/garmin-state
        id: state
        with:
          mode: restore
      - name: Migrate Garmin
        env:
          MIGRATE_COMMAND: ${{ github.event.inputs.migrate_command || 'migrate_garmin_cn_to_global' }}
        run: yarn "$MIGRATE_COMMAND"
      - uses: ./.github/actions/garmin-state
        if: ${{ !cancelled() && steps.state.outcome == 'success' }}
        with:
          mode: save
